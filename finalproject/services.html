<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Browse PAVI Projects services with categories, pricing, and availability for solar, security, and electrical solutions.">

    <meta property="og:title" content="PAVI Projects | Services">

        content="Explore affordable solar, electrical, and security services tailored for homes and businesses.">

    <title>PAVI Projects | Services</title>
    <link rel="icon" href="images/favicon-pv.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="scripts/main.js"></script>
    <script type="module" src="scripts/services.js"></script>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="images/favicon-pv.svg" alt="PAVI Projects logo" width="44" height="44" loading="lazy">
            <span>PAVI Projects</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="services.html" aria-current="page">Services</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="section" aria-labelledby="services-title">
            <h1 id="services-title">Service Directory</h1>
            <p>Browse available service packages and open each card for more details.</p>

            <div class="filter-bar" aria-label="Service filters">
                <button class="pavi-button pavi-button-primary" type="button" data-filter="all">All</button>
                <button class="pavi-button pavi-button-secondary" type="button" data-filter="solar">Solar</button>
                <button class="pavi-button pavi-button-secondary" type="button" data-filter="security">Security</button>
                <button class="pavi-button pavi-button-secondary" type="button"
                    data-filter="maintenance">Maintenance</button>
                <label for="sortBy">Sort:</label>
                <select id="sortBy" name="sortBy">
                    <option value="name">Name</option>
                    <option value="price-asc">Price low-high</option>
                    <option value="price-desc">Price high-low</option>
                </select>
            </div>

            <div id="serviceCards" class="pavi-cards" aria-live="polite"></div>
        </section>

        <dialog id="serviceModal" aria-label="Service details">
            <div id="modalBody" class="modal-content"></div>
        </dialog>
    </main>

    <footer>
        <p>Victor Mtisi</p>
        <p>Last modification: <span id="lastModifiedDate"></span></p>
        <p>&copy; <span id="copyrightYear"></span> PAVI Projects. All rights reserved.</p>
